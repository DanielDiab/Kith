name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and no-model evals (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Run eval suites
        run: swift run agent-evals Evals/suites --out Evals/results/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: Evals/results/
