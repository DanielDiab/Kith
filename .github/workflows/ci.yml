name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and no-model evals (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Run eval suites
        run: swift run agent-evals Evals/suites --out Evals/results/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: Evals/results/

  apple:
    name: Apple build (macOS, EventKit, Foundation Models)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains on this runner
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version
      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Build package (all targets, including AppleData)
        run: swift build --build-tests
      - name: Test package on macOS
        run: swift test
