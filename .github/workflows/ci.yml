name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and no-model evals (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Run eval suites
        run: swift run agent-evals Evals/suites --out Evals/results/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: Evals/results/

  apple:
    name: Apple build (macOS, EventKit, Foundation Models)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains on this runner
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version
      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Build package (all targets, including AppleData)
        run: swift build --build-tests
      - name: Test package on macOS
        run: swift test
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the macOS app
        run: |
          set +e
          xcodebuild -project Kith.xcodeproj -scheme KithMac -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build-for-testing > mac.log 2>&1
          status=$?
          grep -E ": (error|warning): " mac.log | grep -v "/SourcePackages/" | sort -u | head -60
          tail -5 mac.log
          exit $status
      - name: Build the iOS app
        run: |
          set +e
          xcodebuild -project Kith.xcodeproj -scheme KithiOS -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > ios.log 2>&1
          status=$?
          grep -E ": (error|warning): " ios.log | grep -v "/SourcePackages/" | sort -u | head -60
          tail -5 ios.log
          exit $status
